spring.application.name=terminbuchung

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/terminbuchung
spring.datasource.username=terminbuchung
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.praxis.email=${PRAXIS_EMAIL}
app.praxis.password=${PRAXIS_PASSWORD}